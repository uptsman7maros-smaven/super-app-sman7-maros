name: Verify and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: true
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: verify
    if: ${{ success() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply pending Supabase migrations when configured
        shell: bash
        env:
          MIGRATION_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$MIGRATION_BASE" || "$MIGRATION_BASE" =~ ^0+$ ]]; then
            MIGRATION_BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [[ -z "$MIGRATION_BASE" ]]; then
            changed="$(git ls-files 'supabase/migrations/**')"
          else
            changed="$(git diff --name-only "$MIGRATION_BASE" "$GITHUB_SHA" -- 'supabase/migrations/**')"
          fi
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_PROJECT_REF" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            if [[ -n "$changed" ]]; then
              echo "::error::Supabase migrations changed, but SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, and/or SUPABASE_DB_PASSWORD is missing. Refusing to deploy without applying migrations."
              exit 1
            fi
            echo "Supabase secrets are unavailable and no migration files changed; skipping database push."
          else
            echo "Applying any pending Supabase migrations before deployment."
            npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --yes
            npx supabase db push --linked
          fi
      - name: Pull Vercel production settings
        run: npx --yes vercel@68.0.0 pull --yes --environment=production
      - name: Build production deployment
        run: npx --yes vercel@68.0.0 build --prod
      - name: Deploy production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          output="$(npx --yes vercel@68.0.0 deploy --prebuilt --prod --yes)"
          printf '%s\n' "$output"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.vercel\.app' | head -n 1 || true)"
          if [[ -z "$url" ]]; then
            echo "::error::Vercel CLI did not return a deployment URL."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Verify production responds successfully
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-connrefused "$DEPLOYMENT_URL" --output /dev/null
          echo "Production deployment is responding: $DEPLOYMENT_URL"
