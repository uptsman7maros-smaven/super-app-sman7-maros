<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pilih Kandidat - eOSIS</title><link rel="stylesheet" href="css/style.css"></head>
<body><header class="topbar"><div class="school-brand compact"><div class="logo-box"><img data-school-logo alt="Logo sekolah"></div><div><div class="school-name" data-school-name>SMAN 7 MAROS</div><div class="eyebrow">eOSIS</div></div></div><button id="logoutBtn" class="btn danger small">Keluar</button></header>
<main class="container"><section class="welcome"><span data-voting-status class="status-pill open">Memuat...</span><h1 id="welcomeName">Halo!</h1><p id="studentClass" class="muted"></p><div id="alreadyBox" class="notice hidden"></div></section>
<section><div class="section-title"><div><h2>Pilih Kandidat</h2><p class="muted">Baca visi dan misi sebelum menentukan pilihan.</p></div></div><div id="candidateList" class="candidate-grid"><div class="loading">Memuat kandidat...</div></div></section></main>
<div id="confirmModal" class="modal hidden"><div class="modal-card"><button id="closeModal" class="modal-close">×</button><div class="modal-icon">🗳️</div><h2>Konfirmasi Pilihan</h2><p>Anda akan memilih:</p><div id="selectedCandidate" class="selected-candidate"></div><p class="warning">Pilihan tidak dapat diubah setelah suara dikirim.</p><div class="actions"><button id="cancelVote" class="btn secondary">Batal</button><button id="confirmVote" class="btn primary">Ya, Kirim Suara</button></div><p id="voteMessage" class="message"></p></div></div>
<script type="module" src="js/voting.js"></script></body></html>
